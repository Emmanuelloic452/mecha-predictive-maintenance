
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mecha-predictive-maintenance"
version = "0.1.0"
description = "Predictive maintenance for CNC machines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9,<10"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
